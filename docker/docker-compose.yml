
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.dockerfile
    command: ["ng", "serve", "--host=0.0.0.0", "--poll=2000"]
    ports:
      - "4200:4200"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: docker/backend.dockerfile
    command: ["npm", "run", "dev"] 
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://ntpn294:Avans1234@ntpnavans.g3clv.mongodb.net/SportCaster
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
