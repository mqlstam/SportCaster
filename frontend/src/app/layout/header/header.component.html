<header
  class=" text-gray-800 p-4 w-full top-0 z-50"
>
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold text-white">SportCaster</h1>

    <div class="relative flex items-center space-x-4">
      <!-- Register Button -->
      <button
        (click)="openPopup()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
        hidden
      >
        Account
      </button>

      <!-- Circle Icon -->
      <div class="relative">
        <div
          class="w-10 h-10 rounded-full bg-white/80 backdrop-blur-sm overflow-hidden shadow-md flex items-center justify-center cursor-pointer"
          (click)="openAccount()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-gray-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>

        <!-- Dropdown -->
        <div
          id="dropdown-menu"
          class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2"
          *ngIf="isDropdownOpen"
        >
          <a
            href="#profile"
            class="block px-4 py-2 text-gray-800 hover:bg-gray-100"
            (click)="openPopup()"
            >Profile</a
          >
          <a
            href="#logout"
            class="block px-4 py-2 text-gray-800 hover:bg-gray-100"
            (click)="logOut()"
            >Logout</a
          >
        </div>
      </div>
    </div>
  </div>
</header>
