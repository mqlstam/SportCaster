<header class="backdrop-blur-md bg-white/30 text-gray-800 p-4 fixed w-full top-0 z-50 shadow-lg">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-3xl font-extrabold text-white">SportCaster</h1>

    <div class="relative flex items-center space-x-4">
      <!-- Register Button -->
      <button (click)="openPopup()" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
        Register
      </button>
      
      <!-- User Icon -->
      <div class="w-12 h-12 rounded-full bg-white/80 backdrop-blur-sm overflow-hidden shadow-lg flex items-center justify-center cursor-pointer hover:scale-105 transition-transform duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
    </div>
  </div>
</header>
