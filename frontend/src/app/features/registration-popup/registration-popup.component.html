


<div class="popup" *ngIf="popupService.popupStatus$ | async">

    <h2 *ngIf="!alreadyLoggedIn && !isLogin">Register</h2>
    <h2 *ngIf="!alreadyLoggedIn && isLogin">Login</h2>
    <h2 *ngIf="alreadyLoggedIn">Profile</h2>

    <div class="popup-content">

        
        <span class="close-btn" (click)="closePopup()">&times;</span>

        <!-- Dynamic Title -->



        <!-- User Icon and Form -->
        <div class="form-container" *ngIf="!alreadyLoggedIn">

            <!-- Registration/Login Form -->
            <form (ngSubmit)="onSubmit()" *ngIf="!alreadyLoggedIn && !editMode">
                <div *ngIf="!isLogin">
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Name:</label>
                    <input type="text" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Johnnie"  [(ngModel)]="user.userName" name="name" required />
                </div>

                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Your Email</label>
                    <input type="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="user@email.com" [(ngModel)]="user.email" name="email" required />
                </div>

                <div>
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password:</label>
                    <input type="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="•••••••••" [(ngModel)]="user.password" name="password" required />
                </div>

                <div *ngIf="!isLogin">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password:</label>
                    <input type="password" id="password2" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Repeat password" [(ngModel)]="user.password2" name="password" required />
                </div>

                <div>
                    <h5 *ngIf="isLogin" class="mt-4">Don't have an account?</h5>
                    
                    <a class="register" (click)="isRegister()" *ngIf="isLogin"><h5 class="text-blue-400">Register now</h5></a>
                    <a class="register  to-blue-600" (click)="isLogin2()" *ngIf="!isLogin"><h5 class="text-blue-400">Back to login</h5></a>
                </div>

                <button type="submit" *ngIf="!isLogin">Register</button>
                <button type="submit" *ngIf="isLogin">Login</button>
            </form>
        </div>


        



        <!-- Edit Profile -->
        <form *ngIf="alreadyLoggedIn">
            <table class="profile-table">
                <tr>
                    <td class="label">Username:</td>
                    <td class="value">
                        <input type="text" id="username" [(ngModel)]="loggedInUser.userName" name="userName" required />
                    </td>
                </tr>
                <tr><td colspan="2"><hr class="divider"></td></tr>

                <tr>
                    <td class="label">Email:</td>
                    <td class="value">
                        <input type="email" id="email" [(ngModel)]="loggedInUser.email" name="email" required />
                    </td>
                </tr>
                <tr><td colspan="2"><hr class="divider"></td></tr>

                <tr>
                    <td class="label">Password:</td>
                    <td class="value">
                        <input type="password" id="password" [(ngModel)]="loggedInUser.password" name="password" required />
                    </td>
                </tr>

                <tr>
                    <td class="label">City:</td>
                    <td class="value">
                        <input type="text" id="city" [(ngModel)]="loggedInUser.location.city" name="city" required />
                    </td>
                </tr>
                <tr><td colspan="2"><hr class="divider"></td></tr>

                <tr>
                    <td class="label">Intensity Level:</td>
                    <td class="value">
                        <select [(ngModel)]="loggedInUser.preferences.preferredIntensity" name="preferredIntensity">
                            <option [value]="">No preference</option>
                            <option [value]="'low'">Low</option>
                            <option [value]="'medium'">Medium</option>
                            <option [value]="'high'">High</option>
                        </select>
                    </td>
                </tr>
                <tr><td colspan="2"><hr class="divider"></td></tr>

                <tr>
                    <td class="label">Equipment:</td>
                    <td class="value">
                        <div class="equipment-container">
                            <span *ngFor="let item of loggedInUser.equipment" class="equipment-tag">
                                {{ item.item }}
                                <button class="remove-btn" (click)="removeEquipment(item.item)">&times;</button>
                            </span>
                        </div>

                        <select [(ngModel)]="selectedEquipment" name="equipment" (change)="addEquipment()">
                            <option *ngFor="let item of availableEquipment" [value]="item">{{ item }}</option>
                        </select>
                    </td>
                </tr>
                <tr><td colspan="2"><hr class="divider"></td></tr>

                <tr>
                    <td class="label">Duration (minutes):</td>
                    <td class="value">
                        <select [(ngModel)]="loggedInUser.preferences.preferredDuration" name="preferredDuration">
                            <option [value]="0">No preference</option>
                            <option [value]="30">30</option>
                            <option [value]="60">60</option>
                            <option [value]="90">90</option>
                            <option [value]="120">120</option>
                        </select>
                    </td>
                </tr>
            </table>

            <div class="button-group">
                <button type="button" (click)="closePopup()" class="cancel">Cancel</button>
                <button type="button" (click)="saveChanges()">Save</button>
            </div>
        </form>
    </div>
</div>
