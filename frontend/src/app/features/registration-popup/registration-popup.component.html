<!-- registration-popup.component.html -->
<div class="popup" *ngIf="popupService.popupStatus$ | async">
    <div class="popup-content">
        <span class="close-btn" (click)="closePopup()">&times;</span>
        <h2>Account</h2>
        <form (ngSubmit)="onSubmit()">
            <div *ngIf="!isLogin">
                <label for="name">Name:</label>
                <input type="text" id="name" [(ngModel)]="user.userName" name="name" required />
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" [(ngModel)]="user.email" name="email" required />
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" [(ngModel)]="user.password" name="password" required />
            </div>

            <div>
                <a class="register" (click)="isRegister()" *ngIf="isLogin">No account? Register now</a>
                <a class="register" (click)="isLogin2()" *ngIf="!isLogin">Return to login</a>
            </div>

            <button type="submit" *ngIf="!isLogin">Register</button>
            <button type="submit" *ngIf="isLogin">Log in</button>
        </form>
    </div>
</div>
