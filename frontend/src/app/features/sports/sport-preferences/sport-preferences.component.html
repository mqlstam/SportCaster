<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<!-- Formulier voor handmatige locatie-invoer -->
<div class="flex flex-row justify-center gap-6 mb-10">
  <div class="relative">
    <form (ngSubmit)="onSubmit()" #locationForm="ngForm" class="mb-4">
      <label class="block text-sm font-medium mb-2" for="city">
        City
      </label>
      <div class="flex items-stretch">
        <input
          id="city"
          type=""
          [(ngModel)]="city"
          name="city"
          required
          class="border p-3 flex-grow rounded-l-2xl rounded-r-none"
          placeholder="Enter city name"
        />
        <button
          type="submit"
          [disabled]="locationForm.invalid"
          class="px-2 py-2 bg-white text-white border-t border-b border-r-0 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
          aria-label="Search"
        >
          <span class="material-symbols-rounded icon-centered text-black">search</span>
        </button>
        <button
          (click)="onUseCurrentLocation()"
          class="px-2 py-2 bg-white text-white rounded-r-2xl border-l  border-t border-b hover:bg-blue-600"
          aria-label="Use Current Location"
        >
          <span class="material-symbols-rounded icon-centered text-black">my_location</span>
        </button>
      </div>
    </form>
  </div>




  <!-- Intensity Filter -->
  <div>
    <label class="block text-sm font-medium mb-2">Intensity Level</label>
    <select class="w-full p-3 border-none" (change)="onIntensityChange($event)">
      <option value="">All Intensities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <!-- Duration Filter -->
  <div>
    <label class="block text-sm font-medium mb-2">Duration</label>
    <select class="w-full p-3 border-none" (change)="onDurationChange($event)">
      <option value="">All Durations</option>
      <option value="30">30 minutes</option>
      <option value="60">60 minutes</option>
      <option value="90">90 minutes</option>
      <option value="120">120 minutes</option>
    </select>
  </div>

  <!-- Location Filter -->
  <div>
    <label class="block text-sm font-medium mb-2">Location</label>
    <select class="w-full p-3 border-none" (change)="onLocationChange($event)">
      <option value="both">Indoor & Outdoor</option>
      <option value="indoor">Indoor Only</option>
      <option value="outdoor">Outdoor Only</option>
    </select>
  </div>
</div>
